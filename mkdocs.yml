site_name: Damien He Portfolio
site_url: https://mesdwe.github.io/
site_description: Games programmer portfolio for Damien He.
repo_url: https://github.com/Mesdwe/Mesdwe.github.io
repo_name: Mesdwe/Mesdwe.github.io

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: black
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Portfolio: index.md
  - About Me: about.md
  - Projects:
      - "Hunt: Showdown": projects/hunt-showdown.md
      - Down Current: projects/down-current.md
      - Florere Memoriae: projects/florere-memoriae.md
      - "Wickie: Defender of Kitties": projects/wickie.md
      - Animal Chess: projects/animal-chess.md
      - Jalopy: projects/jalopy.md
      - French Kiss: projects/french-kiss.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
