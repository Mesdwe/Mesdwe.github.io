site_name: Damien He - Playable Systems
site_url: https://mesdwe.github.io/
site_description: Game programming portfolio, technical notes, and experiments by Damien He.

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: black
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Projects:
      - All Projects: projects/index.md
      - "Hunt: Showdown": projects/hunt-showdown.md
      - Down Current: projects/down-current.md
      - Florere Memoriae: projects/florere-memoriae.md
      - "Wickie: Defender of Kitties": projects/wickie.md
      - Animal Chess: projects/animal-chess.md
      - Jalopy: projects/jalopy.md
      - French Kiss: projects/french-kiss.md
  - Writing: writing/index.md
  - Lab: lab/index.md
  - About: about.md
  - CV: https://d0fc5bfd-ec07-4057-ae45-9881dede96c4.filesusr.com/ugd/57c5d6_19820915433b4fad950fcbe50ae07725.pdf

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-title.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
